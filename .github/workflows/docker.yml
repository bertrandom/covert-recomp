# Build the build-environment image (docker/Dockerfile) and publish it to the GitHub
# Container Registry as ghcr.io/<owner>/covert-recomp, for linux/amd64 and linux/arm64.
# The image holds only this repository's sources and tools: no game files and no
# Microsoft files (users mount the toolchain archives at /work when they run it).
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # latest for main, the version for v* tags, and the commit SHA
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Smoke test (amd64): the image starts, and without a toolchain it stops with
      # its "mount the archives" message and exit status 2.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: covert-recomp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set +e
          out="$(docker run --rm covert-recomp:test 2>&1)"
          status=$?
          echo "$out"
          [ "$status" -eq 2 ] && echo "$out" | grep -q "Mount a folder holding the Microsoft C 5.1"

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
